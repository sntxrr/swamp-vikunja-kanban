manifestVersion: 1
name: "@sntxrr/vikunja-kanban"
version: "2026.09.26.1"
description: |
  Vikunja kanban orchestrator — creates tasks in a Vikunja project directly
  via the Vikunja REST API and records each as a swamp data resource with its
  ID, title, labels, and status. Built as a homelab-native replacement for
  @webframp/hermes-kanban-orchestrator: no hermes binary, no shell-out — just
  an authenticated HTTP client talking to a self-hosted Vikunja instance.

  New tasks are placed into a named kanban bucket (default "Backlog") of the
  target project — the kanban view is discovered automatically — so
  automation-created tasks land in a backlog column rather than the view's
  default working column. The bucket is resolved before the task is created,
  so an unknown bucket name fails with nothing created. Any project can be
  targeted per call via a projectId argument.

  ## Methods

  - **new_task** — Create a task in a Vikunja project (default or per-call
    projectId), placing it in a named bucket (bucketName) and optionally
    attaching existing labels by title (label / labels), all resolved
    before anything is created.
  - **list_recent** — List the most recently created tasks in a project.
  - **audit** — Read-only Definition-of-Ready audit of the whole board:
    empty/short descriptions, missing labels or label groups, unset
    priority, missing verdict/acceptance/source-link markers, stale cards
    per bucket role (waiting cards: by due date, which they must carry),
    WIP over the limit, buckets out of order.
  - **reorder** — Sort every non-done bucket by priority then age. Dry run
    by default; apply moves one card at a time and re-reads until the
    board converges.
  - **due_report** — Read-only: split the board's dated, not-done cards into
    overdue / due today / upcoming (lookaheadDays) with a link per card and
    a ready-to-send Markdown message, so a scheduled workflow can nudge on
    a card's due date.
  - **set_due_date** — Set or clear one card's due date via a full-task
    read-modify-write, refusing done cards and asserting on read-back that
    the date took and the bucket did not change.
  - **update_task** — Change one card's title, description and/or priority
    via a full-task read-modify-write, asserting each field on read-back and
    moving the card back if the write dropped it out of its bucket.
  - **set_labels** — Attach and detach existing labels on one card by title
    through the label endpoints, with read-back.
  - **move_task** — Move one card into a named bucket (never the done
    bucket) and read the placement back.
  - **close_task** — Mark one card done and move it into the done bucket;
    runs only with humanInstructed: true.

  The edit methods refuse done cards and cards someone else updated within
  policy.recentEditMinutes unless force: true.
repository: "https://github.com/sntxrr/swamp-vikunja-kanban"
paths:
  base: manifest
models:
  - extensions/models/vikunja_kanban.ts
labels:
  - vikunja
  - kanban
  - orchestration
  - homelab
platforms: []
additionalFiles:
  - README.md
  - LICENSE.md
